    <style>
        .in-progress-page .sound-collage-entry {
            --sound-collage-outline-width: 0.7;
            align-items: center;
            display: grid;
            justify-items: center;
            padding: 1.5rem;
        }

        .in-progress-page .sound-collage-entry--hexagon {
            aspect-ratio: 2 / 1.7320508076;
            height: auto;
            width: min(16rem, calc(100vw - 3rem));
        }

        .in-progress-page .sound-collage-entry--rectangle {
            cursor: default;
            height: 3.5rem;
            max-width: calc(100vw - 3rem);
            padding: 0.75rem 1rem;
            width: max-content;
        }

        .sound-collage-entry-text {
            position: relative;
            text-align: center;
            z-index: 1;
        }

        .sound-collage-outline {
            fill: none;
            height: 100%;
            inset: 0;
            overflow: visible;
            pointer-events: none;
            position: absolute;
            stroke: currentColor;
            stroke-width: var(--sound-collage-outline-width);
            width: 100%;
        }

        .sound-collage-outline--offset {
            transform: rotate(10deg);
            transform-origin: center;
        }
        .sound-collage-outline--offset2 {
            transform: rotate(20deg);
            transform-origin: center;
        }
        .sound-collage-outline--offset3 {
            transform: rotate(-10deg);
            transform-origin: center;
        }

        .sound-collage-entry--rectangle .sound-collage-outline--offset {
            transform: rotate(4deg);
        }

        .sound-collage-entry--rectangle .sound-collage-outline--offset2 {
            transform: rotate(8deg);
        }

        .sound-collage-entry--rectangle .sound-collage-outline--offset3 {
            transform: rotate(-4deg);
        }

        .sound-collage-entry--farewell .sound-collage-outline--offset {
            transform: rotate(2.5deg);
        }

        .sound-collage-entry--farewell .sound-collage-outline--offset2 {
            transform: rotate(5deg);
        }

        .sound-collage-entry--farewell .sound-collage-outline--offset3 {
            transform: rotate(-2.5deg);
        }
    </style>
</head>
