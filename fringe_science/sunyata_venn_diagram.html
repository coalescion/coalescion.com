<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>śūnyatā venn diagram.</title>
    <meta name="description" content="a three-way venn diagram of buddhism, the drug experience, and physics">
    <link rel="canonical" href="https://coalescion.com/fringe_science/sunyata_venn_diagram.html">
    <link rel="icon" type="image/png" sizes="96x96" href="../favicon.png">
    <link rel="stylesheet" href="../css/global_styles.css">
    <style>
        .sunyata-page {
            min-height: 100vh;
            overflow-x: hidden;
        }

        .sunyata-main {
            width: min(calc(100% - 2rem), 70rem);
            margin-inline: auto;
            padding: clamp(1.5rem, 5vw, 4rem) 0 3rem;
        }

        .sunyata-figure {
            width: min(96%, 54rem);
            margin: 0 auto;
        }

        .sunyata-figure svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .venn-see-also {
            font-family: "Times New Roman", Times, serif;
            font-size: 20px;
            margin-top: -6rem;
            opacity: 0;
            text-align: center;
            transform: translateY(8px);
            transition: opacity 0.5s ease, transform 0.5s ease, visibility 0s linear 0.5s;
            visibility: hidden;
        }

        .venn-see-also a {
            color: inherit;
        }

        .is-observation-view .venn-see-also,
        .is-meditation-view .venn-see-also,
        .is-time-view .venn-see-also {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 1.05s;
            visibility: visible;
        }

        .venn-see-also__item {
            display: none;
        }

        .is-observation-view .venn-see-also__item--observation,
        .is-meditation-view .venn-see-also__item--meditation,
        .is-time-view .venn-see-also__item--time {
            display: inline;
        }

        .venn-circle {
            fill-opacity: 0.16;
            stroke: #17130f;
            stroke-width: 2.25;
            transform-box: view-box;
            transition: opacity 0.45s ease, transform 1.2s cubic-bezier(0.65, 0, 0.2, 1) 0.22s;
            vector-effect: non-scaling-stroke;
        }

        .venn-circle--buddhism {
            fill: #aa6349;
        }

        .venn-circle--drug {
            fill: #b98550;
        }

        .venn-circle--physics {
            fill: #806052;
        }

        .venn-label {
            fill: #000;
            font-family: "Times New Roman", Times, serif;
            text-anchor: middle;
        }

        .venn-label--domain {
            font-size: 27px;
        }

        .venn-label--overlap {
            font-size: 23px;
            letter-spacing: 0.025em;
        }

        .venn-label--center {
            font-size: 37px;
        }

        .venn-link {
            cursor: pointer;
            outline: none;
            transform-box: view-box;
            transition: opacity 0.4s ease, transform 1s cubic-bezier(0.65, 0, 0.2, 1) 0.35s;
        }

        .venn-link text {
            font-style: italic;
            transition: font-size 1s cubic-bezier(0.65, 0, 0.2, 1) 0.35s;
        }

        .venn-link:not(.venn-link--disabled):hover text,
        .venn-link:not(.venn-link--disabled):focus text {
            font-style: normal;
            font-weight: 700;
        }

        .venn-link--disabled {
            cursor: default;
        }

        .venn-link--buddhism {
            transform-origin: 50% 15.44%;
        }

        .venn-link--drug {
            transform-origin: 25.56% 79.11%;
        }

        .venn-link--physics {
            transform-origin: 74.44% 82.28%;
        }

        .venn-link--meditation {
            transform-origin: 31.78% 47.34%;
        }

        .venn-link--observation {
            transform-origin: 68.22% 47.34%;
        }

        .venn-link--time {
            transform-origin: 50% 76.96%;
        }

        .venn-link--sunyata {
            transform-origin: 50% 59.49%;
        }

        .venn-link--sunyata text {
            transition: opacity 1.4s ease;
        }

        .venn-sunyata-hit-target {
            cursor: pointer;
            fill: transparent;
            pointer-events: none;
        }

        .venn-detail-link {
            cursor: pointer;
            opacity: 0;
            outline: none;
            pointer-events: none;
            transform: translateY(8px);
            transform-box: view-box;
            transition: opacity 0.5s ease, transform 0.5s ease, visibility 0s linear 0.5s;
            visibility: hidden;
        }

        .venn-detail-text {
            fill: #000;
            font-family: "Times New Roman", Times, serif;
            font-size: 20px;
            font-style: normal;
            text-anchor: middle;
        }

        .venn-detail-link:hover text,
        .venn-detail-link:focus text {
            font-weight: 700;
        }

        .is-observation-view .venn-circle--buddhism,
        .is-observation-view .venn-circle--physics,
        .is-returning-observation .venn-circle--buddhism,
        .is-returning-observation .venn-circle--physics {
            transform-origin: 57.5% 49.87%;
        }

        .is-observation-view .venn-circle--buddhism,
        .is-observation-view .venn-circle--physics {
            transform: translate(-7.5%, 0) rotate(-57.54deg);
        }

        .is-observation-view .venn-circle--drug,
        .is-returning-observation .venn-circle--drug {
            transform-origin: 35% 63.3%;
        }

        .is-observation-view .venn-circle--drug {
            opacity: 0;
            transform: scale(0.68);
        }

        .is-observation-view .venn-link--buddhism {
            transform: translate(-23.9%, 22.5%);
        }

        .is-observation-view .venn-link--physics {
            transform: translate(1.1%, -44.3%);
        }

        .is-observation-view .venn-link--observation {
            transform: translate(-18.2%, 3.9%) rotate(90deg);
        }

        .is-observation-view .venn-link--observation text {
            font-size: 29px;
        }

        .is-meditation-view .venn-circle--buddhism,
        .is-meditation-view .venn-circle--drug,
        .is-returning-meditation .venn-circle--buddhism,
        .is-returning-meditation .venn-circle--drug {
            transform-origin: 42.5% 49.87%;
        }

        .is-meditation-view .venn-circle--buddhism,
        .is-meditation-view .venn-circle--drug {
            transform: translate(7.5%, 0) rotate(-122.46deg);
        }

        .is-meditation-view .venn-circle--physics,
        .is-returning-meditation .venn-circle--physics {
            transform-origin: 65% 63.3%;
        }

        .is-meditation-view .venn-circle--physics {
            opacity: 0;
            transform: scale(0.68);
        }

        .is-meditation-view .venn-link--buddhism {
            transform: translate(-23.9%, 22.5%);
        }

        .is-meditation-view .venn-link--drug {
            transform: translate(50%, -43%);
        }

        .is-meditation-view .venn-link--meditation {
            transform: translate(18.2%, 3.9%) rotate(90deg);
        }

        .is-meditation-view .venn-link--meditation text,
        .is-time-view .venn-link--time text {
            font-size: 29px;
        }

        .is-time-view .venn-circle--buddhism,
        .is-returning-time .venn-circle--buddhism {
            transform-origin: 50% 36.46%;
        }

        .is-time-view .venn-circle--buddhism {
            opacity: 0;
            transform: translateY(-8%) scale(0.68);
        }

        .is-time-view .venn-circle--drug {
            transform: translate(1.1%, -13.4%);
        }

        .is-time-view .venn-circle--physics {
            transform: translate(-1.1%, -13.4%);
        }

        .is-time-view .venn-link--drug {
            transform: translate(0.6%, -43%);
        }

        .is-time-view .venn-link--physics {
            transform: translate(1.1%, -44.3%);
        }

        .is-time-view .venn-link--time {
            transform: translate(0, -25.7%) rotate(90deg);
        }

        @keyframes return-observation-label {
            0% {
                transform: translate(-18.2%, 3.9%) rotate(90deg);
            }

            45% {
                transform: translate(-18.2%, 3.9%) rotate(0deg);
            }

            100% {
                transform: none;
            }
        }

        @keyframes return-meditation-label {
            0% {
                transform: translate(18.2%, 3.9%) rotate(90deg);
            }

            45% {
                transform: translate(18.2%, 3.9%) rotate(0deg);
            }

            100% {
                transform: none;
            }
        }

        @keyframes return-time-label {
            0% {
                transform: translate(0, -25.7%) rotate(90deg);
            }

            45% {
                transform: translate(0, -25.7%) rotate(0deg);
            }

            100% {
                transform: none;
            }
        }

        .is-returning-observation .venn-link--observation {
            animation: return-observation-label 1.2s cubic-bezier(0.65, 0, 0.2, 1) both;
        }

        .is-returning-meditation .venn-link--meditation {
            animation: return-meditation-label 1.2s cubic-bezier(0.65, 0, 0.2, 1) both;
        }

        .is-returning-time .venn-link--time {
            animation: return-time-label 1.2s cubic-bezier(0.65, 0, 0.2, 1) both;
        }

        .is-returning-observation .venn-circle--drug,
        .is-returning-meditation .venn-circle--physics,
        .is-returning-time .venn-circle--buddhism {
            transition-delay: 0.55s;
        }

        .is-returning-observation :is(.venn-link--drug, .venn-link--meditation, .venn-link--time, .venn-link--sunyata),
        .is-returning-meditation :is(.venn-link--physics, .venn-link--observation, .venn-link--time, .venn-link--sunyata),
        .is-returning-time :is(.venn-link--buddhism, .venn-link--meditation, .venn-link--observation, .venn-link--sunyata) {
            transition-delay: 1s;
        }

        .is-observation-view .venn-detail-link--observation,
        .is-meditation-view .venn-detail-link--meditation,
        .is-time-view .venn-detail-link--time {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
            transition-delay: 1.05s;
            visibility: visible;
        }

        .is-observation-view :is(.venn-link--drug, .venn-link--meditation, .venn-link--time, .venn-link--sunyata),
        .is-meditation-view :is(.venn-link--physics, .venn-link--observation, .venn-link--time, .venn-link--sunyata),
        .is-time-view :is(.venn-link--buddhism, .venn-link--meditation, .venn-link--observation, .venn-link--sunyata) {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
        }

        .is-sunyata-transition .venn-circle {
            transition-delay: 0s;
            transition-duration: 1.5s;
        }

        .is-sunyata-transition .venn-circle--buddhism {
            transform: translate(0, 168px);
        }

        .is-sunyata-transition .venn-circle--drug {
            transform: translate(135px, -44px);
        }

        .is-sunyata-transition .venn-circle--physics {
            transform: translate(-135px, -44px);
        }

        .is-sunyata-transition .venn-link:not(.venn-link--sunyata),
        .is-sunyata-transition .venn-detail-link {
            opacity: 0;
            pointer-events: none;
            transition-delay: 0s;
            transition-duration: 0.55s;
        }

        .is-sunyata-transition .venn-link--sunyata {
            opacity: 1;
            pointer-events: none;
            transform: none;
        }

        .is-sunyata-converged .venn-link--sunyata {
            pointer-events: auto;
        }

        .is-sunyata-converged .venn-sunyata-hit-target {
            pointer-events: all;
        }

        .is-sunyata-converged .venn-link--sunyata text,
        .is-sunyata-reversing .venn-link--sunyata text {
            opacity: 0;
        }

        .is-sunyata-reversing .venn-link:not(.venn-link--sunyata),
        .is-sunyata-reversing .venn-detail-link {
            opacity: 0;
            pointer-events: none;
            transition-delay: 0s;
        }

        @media (max-width: 600px) {
            .sunyata-main {
                width: calc(100% - 1rem);
                padding-top: 1.25rem;
            }

            .sunyata-figure {
                margin-top: 1.5rem;
            }

            .venn-see-also {
                font-size: clamp(0.875rem, 3.75vw, 1rem);
                line-height: 1.2;
                margin-top: 0;
                padding-inline: 0.75rem;
            }

            .venn-label--domain {
                font-size: 29px;
            }

            .venn-label--overlap {
                font-size: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .venn-circle,
            .venn-link,
            .venn-link text,
            .venn-detail-link,
            .venn-detail-text,
            .venn-see-also {
                transition-duration: 0.01ms;
                transition-delay: 0s;
            }

            .is-sunyata-transition .venn-circle,
            .is-sunyata-transition .venn-link:not(.venn-link--sunyata),
            .is-sunyata-transition .venn-detail-link {
                transition-duration: 0.01ms;
            }

            .is-observation-view .venn-detail-link--observation,
            .is-meditation-view .venn-detail-link--meditation,
            .is-time-view .venn-detail-link--time,
            .is-observation-view .venn-see-also,
            .is-meditation-view .venn-see-also,
            .is-time-view .venn-see-also {
                transition-delay: 0s;
            }

            .is-returning-observation .venn-link--observation,
            .is-returning-meditation .venn-link--meditation,
            .is-returning-time .venn-link--time {
                animation-duration: 0.01ms;
            }

            .is-returning-observation .venn-circle--drug,
            .is-returning-meditation .venn-circle--physics,
            .is-returning-time .venn-circle--buddhism,
            .is-returning-observation .venn-link,
            .is-returning-meditation .venn-link,
            .is-returning-time .venn-link {
                transition-delay: 0s;
            }
        }
    </style>
</head>

    <script>
        const diagram = document.getElementById("venn-diagram");
        const viewClasses = ["is-observation-view", "is-meditation-view", "is-time-view"];
        const returnClasses = ["is-returning-observation", "is-returning-meditation", "is-returning-time"];
        const viewControls = [...diagram.querySelectorAll("[data-view]")];
        let returnTimer;
        const sunyataLink = diagram.querySelector(".venn-link--sunyata");
        const buddhismCircle = diagram.querySelector(".venn-circle--buddhism");
        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const diagramHistoryStateKey = "coalescionSunyataVennView";
        let sunyataState = "idle";

        const saveDiagramView = (view) => {
            const currentHistoryState = window.history.state && typeof window.history.state === "object"
                ? window.history.state
                : {};

            window.history.replaceState({
                ...currentHistoryState,
                [diagramHistoryStateKey]: view
            }, "");
        };

        const restoreDiagramView = () => {
            const savedView = window.history.state?.[diagramHistoryStateKey];
            const savedControl = viewControls.find((control) => control.dataset.view === savedView);

            if (!savedControl) {
                return;
            }

            diagram.classList.add(`is-${savedView}-view`);
            savedControl.setAttribute("aria-pressed", "true");
            savedControl.setAttribute("aria-label", "Return to the three-circle diagram");
        };

        const afterCircleMoves = (callback) => {
            const handleTransitionEnd = (event) => {
                if (event.propertyName !== "transform") {
                    return;
                }

                buddhismCircle.removeEventListener("transitionend", handleTransitionEnd);
                callback();
            };

            buddhismCircle.addEventListener("transitionend", handleTransitionEnd);
        };

        viewControls.forEach((control) => {
            control.dataset.defaultLabel = control.getAttribute("aria-label");

            control.addEventListener("click", (event) => {
                event.preventDefault();

                const viewClass = `is-${control.dataset.view}-view`;
                const isAlreadyActive = diagram.classList.contains(viewClass);

                window.clearTimeout(returnTimer);

                if (isAlreadyActive) {
                    const returnClass = `is-returning-${control.dataset.view}`;
                    diagram.classList.add(returnClass);
                    returnTimer = window.setTimeout(() => {
                        diagram.classList.remove(returnClass);
                    }, 2400);
                } else {
                    diagram.classList.remove(...returnClasses);
                }

                diagram.classList.remove(...viewClasses);
                viewControls.forEach((item) => {
                    item.setAttribute("aria-pressed", "false");
                    item.setAttribute("aria-label", item.dataset.defaultLabel);
                });

                if (!isAlreadyActive) {
                    diagram.classList.add(viewClass);
                    control.setAttribute("aria-pressed", "true");
                    control.setAttribute("aria-label", "Return to the three-circle diagram");
                }

                saveDiagramView(isAlreadyActive ? null : control.dataset.view);
            });
        });

        restoreDiagramView();

        sunyataLink.addEventListener("click", (event) => {
            event.preventDefault();

            if (sunyataState === "animating" || sunyataState === "reversing") {
                return;
            }

            if (sunyataState === "converged") {
                const finishReverse = () => {
                    sunyataState = "idle";
                    diagram.classList.remove("is-sunyata-reversing");
                    diagram.removeAttribute("aria-busy");
                    sunyataLink.setAttribute("aria-label", "Śūnyatā");
                    sunyataLink.setAttribute("aria-pressed", "false");
                };

                sunyataState = "reversing";
                diagram.classList.add("is-sunyata-reversing");
                diagram.classList.remove("is-sunyata-converged", "is-sunyata-transition");
                diagram.setAttribute("aria-busy", "true");

                if (prefersReducedMotion) {
                    finishReverse();
                } else {
                    afterCircleMoves(finishReverse);
                }

                return;
            }

            const finishConvergence = () => {
                sunyataState = "converged";
                diagram.classList.add("is-sunyata-converged");
                diagram.removeAttribute("aria-busy");
                sunyataLink.setAttribute("aria-label", "Return to the three-circle diagram");
                sunyataLink.setAttribute("aria-pressed", "true");
            };

            sunyataState = "animating";
            diagram.classList.remove(...viewClasses);
            saveDiagramView(null);
            diagram.setAttribute("aria-busy", "true");

            if (prefersReducedMotion) {
                diagram.classList.add("is-sunyata-transition");
                finishConvergence();
                return;
            }

            afterCircleMoves(finishConvergence);
            diagram.classList.add("is-sunyata-transition");
        });
    </script>
</body>
</html>
